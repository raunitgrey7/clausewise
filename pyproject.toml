[project]
name = "clausewise"
version = "0.1.0"
description = "Contract intelligence: clause segmentation, classification, risk playbook, redlines and grounded question answering"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Raunit Kumar Thakur" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
embeddings = ["model2vec>=0.4"]
llm = ["anthropic>=0.40"]

[project.scripts]
clausewise = "clausewise.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W", "D1", "RUF"]
ignore = ["D105", "D107", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:clausewise.*"]
